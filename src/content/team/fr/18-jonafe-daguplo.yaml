bio: "Jonafe est infirmière autorisée, titulaire d'une maîtrise en sciences infirmières, et possède de l'expérience dans les essais cliniques en oncologie et sur les maladies rares. Chez BioPortal, elle gère le recrutement des patients, le consentement éclairé et la collecte d'échantillons biologiques, tout en veillant à l'exactitude de la documentation. Elle est dévouée aux soins centrés sur le patient et à l'avancement de la recherche médicale."
